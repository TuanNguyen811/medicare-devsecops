[project]
name = "secagent"
version = "0.1.0"
description = "AI Security Agent: thẩm định phát hiện của công cụ quét, săn lỗi logic và đề xuất bản vá cho Pull Request"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "openai>=3.46.0",
    "pydantic>=2",
]

[project.scripts]
secagent = "secagent.cli:run"
secagent-validate = "secagent.cli:run_validate"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-11-07T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Fixture repos are test data (tests assert their line numbers), not agent code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
# The agent runs git (and, when validating patches, the test command) with argv lists,
# never a shell; S603/S607 would flag every such call.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.17.4",
]
