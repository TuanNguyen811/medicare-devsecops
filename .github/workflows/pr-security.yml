# Security pipeline for every Pull Request into main.
# Scanners run in parallel and write SARIF; the quality gate decides (security/gate/gate.py).
# Contract with the AI agent (plan C): roadmap "Hợp đồng 2".
name: PR Security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            app/uv.lock
            agent/uv.lock
      - name: Install dependencies
        working-directory: app
        run: uv sync --frozen
      - name: Unit and integration tests
        working-directory: app
        run: uv run pytest -q
      - name: Lint
        working-directory: app
        run: uv run ruff check
      - name: Quality gate tests
        run: uv run --no-project --python 3.12 --with pytest pytest security/gate/tests -q
      - name: DAST tooling tests
        working-directory: app
        run: uv run pytest -q ../security/dast/tests
      - name: AI agent tests and lint
        working-directory: agent
        run: |
          uv run --locked pytest -q
          uv run --locked ruff check .

  semgrep:
    name: sast-semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Semgrep (diff-aware against the PR base)
        run: |
          source security/tool-versions.env
          mkdir -p sarif
          uvx --exclude-newer "$TOOLS_EXCLUDE_NEWER" --from "semgrep==${SEMGREP_VERSION}" semgrep scan \
            --metrics off --disable-nosem \
            --config p/python --config p/owasp-top-ten --config security/semgrep/medicare.yml \
            --baseline-commit "$BASE_SHA" --sarif --output sarif/semgrep.sarif app agent/src
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-semgrep
          path: sarif/semgrep.sarif
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: sarif/semgrep.sarif
          category: semgrep

  bandit:
    name: sast-bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Bandit
        run: |
          source security/tool-versions.env
          mkdir -p sarif
          uvx --exclude-newer "$TOOLS_EXCLUDE_NEWER" --from "bandit[sarif]==${BANDIT_VERSION}" \
            bandit -r app/medicare agent/src --ignore-nosec -f sarif -o sarif/bandit.sarif --exit-zero
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-bandit
          path: sarif/bandit.sarif
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: sarif/bandit.sarif
          category: bandit

  codeql:
    name: sast-codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
          queries: security-extended
          config: |
            paths:
              - app/medicare
              - agent/src
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql
          output: codeql-results
          upload: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'always' || 'never' }}
      - name: Collect SARIF
        run: |
          mkdir -p sarif
          cp codeql-results/python.sarif sarif/codeql.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-codeql
          path: sarif/codeql.sarif
          if-no-files-found: error

  trivy:
    name: sca-trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned scanners
        run: bash security/install-tools.sh "$RUNNER_TEMP/tools"
      - name: Cache key (refreshed daily)
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
      - name: Trivy (every dependency manifest in the repo, e.g. app/uv.lock)
        run: |
          mkdir -p sarif
          "$RUNNER_TEMP/tools/trivy" fs --scanners vuln --skip-dirs .git \
            --format sarif --output sarif/trivy.sarif .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-trivy
          path: sarif/trivy.sarif
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: sarif/trivy.sarif
          category: trivy

  gitleaks:
    name: secret-gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanners
        run: bash security/install-tools.sh "$RUNNER_TEMP/tools"
      - name: Gitleaks (commits of this PR only, secrets redacted)
        run: |
          mkdir -p sarif
          "$RUNNER_TEMP/tools/gitleaks" git --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --config security/gitleaks.toml --ignore-gitleaks-allow --redact --exit-code 0 \
            --report-format sarif --report-path sarif/gitleaks.sarif .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-gitleaks
          path: sarif/gitleaks.sarif
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: sarif/gitleaks.sarif
          category: gitleaks

  iac:
    name: iac-checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Checkov (Terraform, Kubernetes, Dockerfile)
        run: |
          source security/tool-versions.env
          mkdir -p sarif checkov-out
          uvx --exclude-newer "$TOOLS_EXCLUDE_NEWER" --from "checkov==${CHECKOV_VERSION}" \
            checkov -d . --config-file security/checkov.yaml \
            -o sarif --output-file-path checkov-out --soft-fail --quiet
          mv checkov-out/results_sarif.sarif sarif/checkov.sarif
      - name: zizmor (GitHub Actions workflows)
        run: |
          source security/tool-versions.env
          # Run from the repo root so SARIF paths are repo-relative (.github/workflows/x.yml)
          # and match the files the PR changed. The gate decides, not this step.
          uvx --exclude-newer "$TOOLS_EXCLUDE_NEWER" "zizmor==${ZIZMOR_VERSION}" --offline --format sarif . \
            > sarif/zizmor.sarif || test -s sarif/zizmor.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-iac
          path: |
            sarif/checkov.sarif
            sarif/zizmor.sarif
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: sarif/checkov.sarif
          category: checkov
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: sarif/zizmor.sarif
          category: zizmor

  # DAST (spec addendum 5): the PR's build runs on the runner, ZAP scans it once per role,
  # logged in as that role's demo account. Like validate-patches, no secret is referenced: the
  # database password, SECRET_KEY and DEMO_PASSWORD are generated here and never printed.
  dast-zap:
    name: dast-zap
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        role: [ADMIN, RECEPTIONIST, DOCTOR, NURSE, PATIENT]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ephemeral secrets (generated here, never printed)
        run: |
          umask 077
          rand() { openssl rand -hex "$1"; }
          pg="$(rand 24)"
          {
            echo "ENV=development"
            echo "SECRET_KEY=$(rand 48)"
            echo "POSTGRES_USER=medicare"
            echo "POSTGRES_DB=medicare"
            echo "POSTGRES_PASSWORD=${pg}"
            echo "DATABASE_URL=postgresql+psycopg://medicare:${pg}@db:5432/medicare"
            echo "DEMO_PASSWORD=Demo-$(rand 12)"
          } > app/.env
      - name: Start the PR's app
        run: docker compose -f infra/docker-compose.yml -p dast up -d --build --wait --wait-timeout 180
      - name: Seed demo data and export the route map
        run: |
          compose="docker compose -f infra/docker-compose.yml -p dast"
          $compose exec -T app python -m medicare.seed
          mkdir -p dast-out
          $compose exec -T app python - --stdout < security/dast/export_routes.py > dast-out/bundle.json
          python3 security/dast/export_routes.py --split dast-out/bundle.json dast-out
      - name: ZAP scan, authenticated as one role
        env:
          ROLE: ${{ matrix.role }}
        run: |
          DEMO_PASSWORD="$(sed -n 's/^DEMO_PASSWORD=//p' app/.env)"
          export DEMO_PASSWORD
          bash security/dast/run-dast.sh --target http://app:8000 --network dast_default \
            --work dast-out --roles "$ROLE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-raw-${{ matrix.role }}
          path: |
            dast-out/out/zap-${{ matrix.role }}.json
            dast-out/routes.json
          if-no-files-found: error
      - name: Tear down
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml -p dast down -v
          rm -f app/.env

  dast:
    name: dast
    needs: [dast-zap]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      # Fail-safe: a role that was not scanned never reads as "no findings".
      - name: Every role must have been scanned
        env:
          RESULT: ${{ needs.dast-zap.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::DAST did not complete for every role ($RESULT); failing safe."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dast-raw-*
          path: dast-raw
      - name: Merge the role reports into SARIF
        run: |
          mkdir -p sarif
          reports=()
          for role in ADMIN RECEPTIONIST DOCTOR NURSE PATIENT; do
            reports+=("$role=dast-raw/dast-raw-$role/out/zap-$role.json")
          done
          python3 security/dast/zap2sarif.py --routes dast-raw/dast-raw-ADMIN/routes.json \
            --out sarif/zap.sarif "${reports[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-zap
          path: sarif/zap.sarif
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: sarif/zap.sarif
          category: dast

  ai-agent:
    name: ai-security-agent
    needs: [semgrep, bandit, codeql, trivy, gitleaks, iac, dast]
    # Fork PRs get no secrets; the gate then stays on traditional mode.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            agent/uv.lock
            app/uv.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - name: AI review (the only step holding the LLM key; it does not run the app or its tests)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: |
          # The checkout is the PR's code: an out/ committed in the PR (e.g. out/agent-exit=0
          # with an all-FP report.json) must never be mistaken for this job's results.
          rm -rf out
          mkdir out
          set +e
          uv run --project agent --locked secagent --mode ci --repo . \
            --base "$BASE_SHA" --head "$HEAD_SHA" --sarif-dir sarif \
            --requirements docs/security-requirements.md --out out
          echo "$?" > out/agent-exit
          echo "secagent exit code: $(cat out/agent-exit) (2 = agent unavailable, gate falls back)"
      # Uploaded before any application or test code of the PR runs anywhere: the quality
      # gate reads only this artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-report
          path: out/
          if-no-files-found: ignore
          include-hidden-files: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('out/agent.sarif') != ''
        with:
          sarif_file: out/agent.sarif
          category: ai-agent

  validate-patches:
    name: validate-patches
    needs: [ai-agent]
    if: always() && needs.ai-agent.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Applies the proposed patches and runs the PR's tests. No secret is referenced in this job,
    # nothing it writes is read by the quality gate, and it does not save the uv cache.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          save-cache: false
          cache-dependency-glob: |
            agent/uv.lock
            app/uv.lock
      # out/ from the PR checkout is attacker-controlled: only the downloaded artifact counts.
      - name: Discard any out/ committed in the PR
        run: rm -rf out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-report
          path: out
      - name: Validate proposed patches (worktree + tests + Semgrep)
        run: |
          if [ ! -s out/report.json ]; then
            echo "Nothing to validate (no agent report)."
            exit 0
          fi
          uv run --project agent --locked secagent-validate --out out --repo . \
            --head "$HEAD_SHA" --max-patches 2 || echo "::warning::secagent-validate failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-validation
          path: out/report.json
          if-no-files-found: ignore

  agent-comment:
    name: agent-comment
    needs: [ai-agent, validate-patches]
    if: always() && needs.ai-agent.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Write access to the PR, but no checkout: this job never runs code from the PR.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-report
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-validation
          path: validation
      - name: Post or update the agent report and its suggestions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s out/report.md ]; then
            echo "No agent report (no LLM key configured, or the agent did not run)."
            exit 0
          fi
          cp out/report.md comment.md
          if [ -s validation/report.json ]; then
            {
              echo
              echo "### Kiểm chứng bản vá"
              echo "_Chạy trong job riêng không có secret; chỉ để tham khảo, quality gate không dùng._"
              echo
              jq -r '.findings[] | select(.fix != null and .fix.validated != null)
                | "- `\(.finding_id)`: \(if .fix.validated then "✅ đạt" else "❌ không đạt" end) — \(.fix.validation_note)"' \
                validation/report.json
            } >> comment.md
          fi
          # Only the bot's own comment is updated (anyone can post a comment with the marker).
          existing="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]")
              | select(.body | startswith("<!-- secagent-report -->")) | .id' | tail -n 1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
          if [ -s out/review.json ]; then
            seen="$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\")
                | select(.body | contains(\"secagent-review:$HEAD_SHA\")) | .id")"
            if [ -z "$seen" ]; then
              # A review from the agent is never an approval.
              jq '.event = "COMMENT"' out/review.json > review.json
              gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --input review.json > /dev/null \
                || echo "::warning::Could not post the suggestion review"
            fi
          fi

  quality-gate:
    name: quality-gate
    needs: [build-test, semgrep, bandit, codeql, trivy, gitleaks, iac, dast, ai-agent]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - name: Every scanner and the test suite must have completed
        env:
          # The AI agent is not listed: if it fails, the gate falls back to traditional mode.
          RESULTS: >-
            ${{ needs.build-test.result }} ${{ needs.semgrep.result }}
            ${{ needs.bandit.result }} ${{ needs.codeql.result }} ${{ needs.trivy.result }}
            ${{ needs.gitleaks.result }} ${{ needs.iac.result }} ${{ needs.dast.result }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A scanner or the test job did not succeed ($RESULTS); failing safe."
              exit 1
            fi
          done
      # out/ from the PR checkout is attacker-controlled: only the downloaded artifact counts.
      - name: Discard any out/ committed in the PR
        run: rm -rf out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-report
          path: out
      - name: Quality gate
        env:
          SECURITY_GATE_MODE: ${{ vars.SECURITY_GATE_MODE || 'traditional' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Changed files = git diff from the merge base of BASE_SHA and HEAD_SHA.
          # A missing agent report or exit code means the agent did not run: exit 2 →
          # traditional mode (fail-safe, roadmap Contract 2).
          AGENT_EXIT="$(cat out/agent-exit 2>/dev/null || echo 2)"
          python3 security/gate/gate.py --sarif-dir sarif --base "$BASE_SHA" --head "$HEAD_SHA" \
            --mode "$SECURITY_GATE_MODE" --labels "$PR_LABELS" \
            --report out/report.json --agent-exit "$AGENT_EXIT" \
            --workspace "$GITHUB_WORKSPACE" --summary "$GITHUB_STEP_SUMMARY"
