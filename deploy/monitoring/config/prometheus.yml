global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  # Every MediCare pod, found through the headless Service medicare-metrics (deploy/local).
  - job_name: medicare
    dns_sd_configs:
      - names: ["medicare-metrics.medicare.svc.cluster.local"]
        type: A
        port: 9000
        refresh_interval: 15s
