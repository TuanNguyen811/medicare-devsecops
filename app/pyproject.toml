[project]
name = "medicare"
version = "0.1.0"
description = "MediCare HMS - hệ thống quản lý bệnh viện (dữ liệu demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "faker>=40.44.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# conftest sets testcontainers env vars before importing it.
"tests/conftest.py" = ["E402"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]
