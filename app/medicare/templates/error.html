{% extends "base.html" %}
{% block title %}Lỗi {{ status }}{% endblock %}
{% macro body() %}
<div class="card mc-card">

    <div class="display-6 text-secondary">{{ status }}</div>

</div>
{% endmacro %}
{% block content %}{{ body() }}{% endblock %}
{% block public %}{{ body() }}{% endblock %}
