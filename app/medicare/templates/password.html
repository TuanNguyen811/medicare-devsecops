{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<h1 class="h5 mb-3">Đổi mật khẩu</h1>
{% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
<div class="card mc-card" style="max-width: 480px;">
  <div class="card-body">
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="current_password">Mật khẩu hiện tại</label>
        <input class="form-control" id="current_password" name="current_password" type="password" maxlength="128" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">Mật khẩu mới (tối thiểu 10 ký tự)</label>
        <input class="form-control" id="new_password" name="new_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Nhập lại mật khẩu mới</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password" maxlength="128" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
    </form>
  </div>
</div>
{% endblock %}
