{% extends "base.html" %}
{% block title %}Quên mật khẩu{% endblock %}
{% block public %}
<div class="card mc-card">
  <div class="card-body p-4">
    <h1 class="h5 mb-2">Quên mật khẩu</h1>
    <p class="text-secondary small">Nhập email đã đăng ký với bệnh viện. Chúng tôi sẽ gửi liên kết để bạn đặt mật khẩu mới.</p>
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/forgot-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email or '' }}" maxlength="254" autocomplete="email" autofocus required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Gửi liên kết</button>
    </form>
    <p class="small text-center mt-3 mb-0"><a href="/login">Quay lại đăng nhập</a></p>
  </div>
</div>
{% endblock %}
