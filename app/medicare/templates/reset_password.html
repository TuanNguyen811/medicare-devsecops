{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu{% endblock %}
{% block public %}
<div class="card mc-card">
  <div class="card-body p-4">
    <h1 class="h5 mb-3">Đặt lại mật khẩu</h1>
    {% if invalid %}
    <div class="alert alert-danger py-2" role="alert">Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</div>
    <p class="small text-center mb-0"><a href="/forgot-password">Gửi lại liên kết</a></p>
    {% else %}
    {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/reset-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">
      <div class="mb-3">
        <label class="form-label" for="new_password">Mật khẩu mới (tối thiểu 10 ký tự)</label>
        <input class="form-control" id="new_password" name="new_password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Nhập lại mật khẩu mới</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password" maxlength="128" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Đặt mật khẩu mới</button>
    </form>
    {% endif %}
  </div>
</div>
{% endblock %}
