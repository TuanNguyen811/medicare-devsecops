{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="h5 mb-3">{{ title }} <span class="text-secondary">{{ patient.code }} - {{ patient.full_name }}</span></h1>
{% if errors %}
<div class="alert alert-danger py-2" role="alert">
  <ul class="mb-0 ps-3">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
</div>
{% endif %}
<div class="card mc-card" style="max-width: 820px;">
  <div class="card-body">
    <form method="post" action="{{ action }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="visit_date">Ngày khám</label>
          <input class="form-control" id="visit_date" name="visit_date" type="date" value="{{ values.visit_date or '' }}" required>
        </div>
        <div class="col-md-12">
          <label class="form-label" for="symptoms">Triệu chứng</label>
          <textarea class="form-control" id="symptoms" name="symptoms" rows="3" maxlength="2000" required>{{ values.symptoms or '' }}</textarea>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="diagnosis_code">Mã ICD-10</label>
          <input class="form-control font-monospace" id="diagnosis_code" name="diagnosis_code" value="{{ values.diagnosis_code or '' }}" maxlength="20" placeholder="VD: J18.9" required>
        </div>
        <div class="col-md-9">
          <label class="form-label" for="diagnosis_text">Chẩn đoán</label>
          <input class="form-control" id="diagnosis_text" name="diagnosis_text" value="{{ values.diagnosis_text or '' }}" maxlength="500" required>
        </div>
        <div class="col-md-12">
          <label class="form-label" for="notes">Ghi chú</label>
          <textarea class="form-control" id="notes" name="notes" rows="3" maxlength="5000">{{ values.notes or '' }}</textarea>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Lưu</button>
        <a class="btn btn-outline-secondary" href="/patients/{{ patient.id }}/records">Hủy</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
